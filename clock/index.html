<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Timezone Digital Clock</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1><i class="fas fa-clock"></i> Multi-Timezone Clock</h1>
                <p>Current time across different time zones</p>
            </div>
            <div class="header-controls">
                <button class="btn-add-timezone" id="btnAddTimezone">
                    <i class="fas fa-plus"></i> Add Timezone
                </button>
                <button class="btn-settings" id="btnSettings">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </header>

        <!-- Search/Filter Section -->
        <div class="search-section">
            <input 
                type="text" 
                id="searchInput" 
                class="search-input" 
                placeholder="Search timezone... (e.g., 'New York', 'London', 'Tokyo')"
            >
            <span class="search-icon"><i class="fas fa-search"></i></span>
        </div>

        <!-- Clocks Grid -->
        <div class="clocks-container" id="clocksContainer">
            <!-- Clocks will be dynamically added here -->
        </div>

        <!-- Settings Panel -->
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-content">
                <h2>Settings</h2>
                <div class="setting-group">
                    <label class="setting-item">
                        <input type="checkbox" id="toggle12Hour" checked>
                        <span>12-Hour Format</span>
                    </label>
                    <label class="setting-item">
                        <input type="checkbox" id="toggleSeconds" checked>
                        <span>Show Seconds</span>
                    </label>
                    <label class="setting-item">
                        <input type="checkbox" id="toggleDate" checked>
                        <span>Show Date</span>
                    </label>
                    <label class="setting-item">
                        <input type="checkbox" id="toggleAnalog" checked>
                        <span>Show Analog Clock</span>
                    </label>
                </div>
                <div class="setting-group">
                    <label for="themeSelect">Theme:</label>
                    <select id="themeSelect">
                        <option value="dark">Dark</option>
                        <option value="light">Light</option>
                        <option value="gradient">Gradient</option>
                        <option value="neon">Neon</option>
                    </select>
                </div>
                <button class="btn-close-settings" id="btnCloseSettings">
                    <i class="fas fa-times"></i> Close
                </button>
            </div>
        </div>

        <!-- Add Timezone Modal -->
        <div class="modal" id="addTimezoneModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Add New Timezone</h2>
                    <button class="modal-close" id="modalCloseBtn">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <input 
                        type="text" 
                        id="timezoneInput" 
                        class="timezone-input" 
                        placeholder="Search timezone (e.g., 'America/New_York')"
                    >
                    <div class="timezone-suggestions" id="timezoneSuggestions"></div>
                    <div class="popular-timezones">
                        <h3>Popular Timezones:</h3>
                        <div class="timezone-list" id="popularTimezones"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Overlay for modals/panels -->
        <div class="overlay" id="overlay"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
